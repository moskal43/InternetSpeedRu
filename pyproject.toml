[project]
name = "internetspeedru"
version = "0.1.0"
description = "Home Assistant integration for Iperf3 measurements through public servers in Russia"
readme = "README.md"
requires-python = ">=3.14.2"
license = "MIT"
dependencies = ["iperf3==0.1.11"]

[dependency-groups]
dev = [
    "homeassistant==2026.8.3",
    "pytest",
    "pytest-homeassistant-custom-component",
    "ruff",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "PYI", "RUF", "UP"]
