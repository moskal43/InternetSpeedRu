name: HACS

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate HACS repository
        uses: hacs/action@main
        with:
          category: integration
          ignore: brands
